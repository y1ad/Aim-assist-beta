name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.2.1 || true
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/g.zip
            sudo unzip -q /tmp/g.zip -d /opt
            /opt/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew
      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AimProxy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
